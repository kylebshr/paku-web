<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <title>Paku - Giving</title>

  <meta property="og:image" content="https://paku.app/images/widget-card.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://paku.app/android-chrome-256x256.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../css/skeleton.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/light.css">

  <meta name="theme-color" content="#181820" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="white">

  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="mask-icon" href="../safari-pinned-tab.svg" color="#5739ec">
  <meta name="msapplication-TileColor" content="#ffffff">

  <script src="https://cdn.telemetrydeck.com/websdk/telemetrydeck.min.js" data-app-id="C65919C7-3E1A-4C1C-BBCB-D43E38E60406"></script>

</head>
<body>

  <div class="container">

    <div class="row">
      <div class="twelve columns" style="margin-top: 10%">

        <a href="../index.html"><img src="../images/app-icon-web.webp" width="100" height="100" alt="The Paku logo, an icon that represents wind"></a>

        <br>
        <br>

        <h1>Giving</h1>

        <p>Each month, I donate a portion of Paku’s revenue to a charity fighting climate change or reducing the impact of wildfires. Every donation is listed below, with a receipt showing the amount.</p>

        <ul class="donation-list">
          <!-- Populated from the Paku API; see the script at the bottom of the page. -->
        </ul>
      </div>
    </div>
  </div>

  {% include footer.html %}

  <script>
    (function () {
      var list = document.querySelector('.donation-list');

      var monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      // "2026-07" -> "July 2026"
      function monthLabel(month) {
        var parts = month.split('-');
        var name = monthNames[Number(parts[1]) - 1];
        return name ? name + ' ' + parts[0] : month;
      }

      fetch('https://api.paku.app/donation-recipients')
        .then(function (response) {
          if (!response.ok) { throw new Error('HTTP ' + response.status); }
          return response.json();
        })
        .then(function (recipients) {
          recipients
            .filter(function (recipient) { return recipient.receiptURL; })
            .reverse() // The API sorts oldest first; show the newest donation at the top.
            .forEach(function (recipient) {
              var month = document.createElement('span');
              month.className = 'donation-month';
              month.textContent = monthLabel(recipient.month);

              // url is null when a recipient has no charity link; show
              // the name as plain text in that case.
              var link;
              if (recipient.url) {
                link = document.createElement('a');
                link.href = recipient.url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = recipient.name + ' ↗';
              } else {
                link = document.createElement('span');
                link.textContent = recipient.name;
              }
              link.className = 'donation-name';

              var receipt = document.createElement('a');
              receipt.className = 'donation-receipt';
              receipt.href = recipient.receiptURL;
              receipt.target = '_blank';
              receipt.rel = 'noopener';
              receipt.textContent = 'Receipt';

              var item = document.createElement('li');
              item.appendChild(month);
              item.appendChild(link);
              item.appendChild(receipt);
              list.appendChild(item);
            });
        })
        .catch(function () {
          // Leave the list empty rather than showing an error on the page.
        });
    })();
  </script>

</body>
</html>
